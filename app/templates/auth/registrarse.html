{% extends "base.html" %}

{% block title %}Registrarse — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Crear cuenta</h1>

    {% if error %}
        <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.registrarse') }}" class="register-form">
        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombres">Nombres</label>
            <input type="text" id="nombres" name="nombres" required autofocus>

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" required>

            <label for="tipo_documento_id">Tipo de documento</label>
            <select id="tipo_documento_id" name="tipo_documento_id">
                {% for t in tipos_documento %}
                    <option value="{{ t.id }}">{{ t.codigo }} — {{ t.nombre }}</option>
                {% endfor %}
            </select>

            <label for="numero_documento">Número de documento</label>
            <input type="text" id="numero_documento" name="numero_documento" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" value="Empleado">
        </fieldset>

        <fieldset>
            <legend>Credenciales</legend>

            <label for="nombre_usuario">Nombre de usuario</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" required>

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required>

            <label for="rol">Rol</label>
            <select id="rol" name="rol">
                <option value="RECEPCIONISTA" selected>Recepcionista</option>
                <option value="TECNICO">Técnico</option>
                <option value="VENDEDOR">Vendedor</option>
                <option value="ALMACENERO">Almacenero</option>
                <option value="SUPERVISOR">Supervisor</option>
                <option value="ADMINISTRADOR">Administrador</option>
            </select>

            <label for="password">Contraseña (mínimo 8 caracteres)</label>
            <input type="password" id="password" name="password" required minlength="8">
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
    </form>

    <p class="hint">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </p>
</div>
{% endblock %}
