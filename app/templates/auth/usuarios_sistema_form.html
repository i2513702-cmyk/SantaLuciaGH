{% extends "base.html" %}

{% block title %}Nuevo usuario — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Nuevo usuario del sistema</h1>

    {% if error %}
        <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.usuarios_sistema_nuevo') }}">
        <label for="nombre_usuario">Nombre de usuario</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" required>

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required>

        <label for="rol">Rol</label>
        <select id="rol" name="rol">
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="SUPERVISOR">Supervisor</option>
            <option value="TECNICO">Técnico</option>
            <option value="RECEPCIONISTA" selected>Recepcionista</option>
            <option value="VENDEDOR">Vendedor</option>
            <option value="ALMACENERO">Almacenero</option>
        </select>

        <label for="empleado_id">ID de empleado (existente)</label>
        <input type="number" id="empleado_id" name="empleado_id" required placeholder="Ej: 1">

        <p class="hint">La contraseña por defecto será <code>123456</code> (bcrypt).</p>

        <button type="submit" class="btn btn-primary btn-block">Crear usuario</button>
    </form>
</div>
{% endblock %}
