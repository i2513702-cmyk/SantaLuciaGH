<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#dbe3ee"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="560" cy="60" r="90" fill="#f59e0b" opacity="0.12"/>
  <circle cx="70" cy="420" r="120" fill="#3b82f6" opacity="0.14"/>

  <!-- Lavadora -->
  <g>
    <rect x="330" y="90" width="190" height="290" rx="24" fill="url(#app)"/>
    <rect x="330" y="90" width="190" height="290" rx="24" fill="none" stroke="#c3cad4" stroke-width="3"/>
    <circle cx="425" cy="185" r="62" fill="#eef4ff"/>
    <circle cx="425" cy="185" r="62" fill="none" stroke="#93c5fd" stroke-width="6"/>
    <circle cx="425" cy="185" r="26" fill="#bfdbfe"/>
    <rect x="395" y="300" width="60" height="10" rx="5" fill="#94a3b8"/>
    <rect x="405" y="318" width="40" height="6" rx="3" fill="#cbd5e1"/>
    <!-- indicador -->
    <circle cx="358" cy="120" r="6" fill="#16a34a"/>
  </g>

  <!-- Llave de tubo -->
  <g transform="translate(160 170) rotate(-35)">
    <rect x="0" y="0" width="22" height="150" rx="8" fill="#f59e0b"/>
    <rect x="-14" y="128" width="50" height="30" rx="10" fill="#d97706"/>
  </g>

  <!-- Destornillador -->
  <g transform="translate(120 300) rotate(20)">
    <rect x="0" y="0" width="14" height="70" rx="7" fill="#fbbf24"/>
    <rect x="4" y="70" width="6" height="46" fill="#64748b"/>
  </g>

  <!-- Rueda dentada -->
  <g transform="translate(565 330)">
    <circle cx="0" cy="0" r="26" fill="#fef3c7"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="12 10"/>
    <circle cx="0" cy="0" r="12" fill="#f59e0b"/>
  </g>

  <!-- etiqueta flotante -->
  <g transform="translate(205 70)">
    <rect x="-8" y="-20" width="150" height="40" rx="20" fill="#ffffff"/>
    <text x="67" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Garantía 90 días</text>
  </g>
  <g transform="translate(470 400)">
    <rect x="-8" y="-20" width="120" height="40" rx="20" fill="#f59e0b"/>
    <text x="52" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">A domicilio</text>
  </g>
</svg>