<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Microondas en revisión">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="carcasa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbe3ee"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fondo)"/>
  <circle cx="705" cy="95" r="115" fill="#38bdf8" opacity="0.14"/>
  <circle cx="85" cy="520" r="145" fill="#2563eb" opacity="0.10"/>

  <!-- Microondas -->
  <rect x="170" y="150" width="460" height="300" rx="28" fill="url(#carcasa)" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="170" y="150" width="460" height="300" rx="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Puerta -->
  <rect x="200" y="180" width="310" height="240" rx="18" fill="url(#vidrio)" opacity="0.92"/>
  <rect x="200" y="180" width="310" height="240" rx="18" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <path d="M222 200 H300 L222 340 Z" fill="#ffffff" opacity="0.10"/>
  <rect x="486" y="220" width="12" height="160" rx="6" fill="#94a3b8"/>

  <!-- Interior: plato y taza con vapor -->
  <ellipse cx="355" cy="372" rx="105" ry="22" fill="#ffffff" opacity="0.16"/>
  <ellipse cx="355" cy="368" rx="80" ry="16" fill="#e2e8f0" opacity="0.35"/>
  <rect x="325" y="318" width="60" height="42" rx="10" fill="#f8fafc" opacity="0.9"/>
  <path d="M385 328 q18 0 18 16 q0 16 -18 16" fill="none" stroke="#f8fafc" stroke-width="8" opacity="0.9"/>
  <path d="M338 300 q-10 -14 0 -28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M356 300 q-10 -14 0 -28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M374 300 q-10 -14 0 -28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- Panel de control -->
  <rect x="535" y="180" width="70" height="240" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="547" y="198" width="46" height="30" rx="6" fill="#0f172a" opacity="0.8"/>
  <rect x="553" y="208" width="34" height="10" rx="3" fill="#38bdf8" opacity="0.9"/>
  <circle cx="570" cy="272" r="17" fill="#f59e0b"/>
  <circle cx="570" cy="272" r="6" fill="#b45309"/>
  <rect x="548" y="312" width="44" height="10" rx="5" fill="#94a3b8"/>
  <rect x="548" y="334" width="44" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="548" y="356" width="44" height="10" rx="5" fill="#cbd5e1"/>
  <circle cx="556" cy="392" r="7" fill="#16a34a"/>
  <rect x="572" y="387" width="22" height="10" rx="5" fill="#cbd5e1"/>

  <!-- Ondas de calor -->
  <path d="M120 250 q-24 24 0 48" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path d="M98 236 q-38 38 0 76" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  <path d="M680 310 q24 -24 0 -48" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <path d="M702 324 q38 -38 0 -76" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- Base -->
  <rect x="205" y="452" width="390" height="12" rx="6" fill="#94a3b8" opacity="0.5"/>
  <rect x="250" y="464" width="34" height="14" rx="5" fill="#94a3b8" opacity="0.55"/>
  <rect x="516" y="464" width="34" height="14" rx="5" fill="#94a3b8" opacity="0.55"/>
</svg>
